<!DOCTYPE html>
<html>
<head>
	<title>tabla2</title>
</head>
<body>
	<div th:fragment="tabla2">
		<div class="row d-flex align-items-center">
			<div class="col"></div>
			<div class="col">
			<table>
				<thead>
					<tr>
						<th>DNI</th>
						<th>Nombre</th>
						<th>Apellido</th>
						<th>Acción</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
			<div class="row mt-3">
				<div class="col-sm-3 d-flex justify-content-start">
					<div class="row">
						<div class="col">
							<button class="btn btn-secondary" id="firstBtn">
								<i class="bi bi-arrow-bar-left"></i>
							</button>
						</div>
						<div class="col">
							<button class="btn btn-secondary" id="prevBtn">
								<i class="bi bi-arrow-left"></i>
							</button>
						</div>
					</div>
				</div>
				<div class="col-sm-6 d-flex justify-content-center">
					<button class="btn btn-primary" id="newEmp">Nuevo empleado</button>
				</div>
				<div class="col-sm-3 d-flex justify-content-end">
					<div class="row">
						<div class="col">
							<button class="btn btn-secondary" id="nextBtn">
								<i class="bi bi-arrow-right"></i>
							</button>
						</div>
						<div class="col">
							<button class="btn btn-secondary" id="lastBtn">
								<i class="bi bi-arrow-bar-right"></i>
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
			<div class="col"></div>
		</div>
	</div>
</body>
</html>
