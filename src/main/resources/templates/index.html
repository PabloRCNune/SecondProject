<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<title>Empleados</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<style>
	table,
	th,
	td {
		border: 1px solid black;
		border-collapse: collapse;
	}

	th,
	td {
		padding: 8px;
		text-align: left;
	}
</style>

<body>
	<div class="container p-4">
		<div class="row">
			<div class="col-md-12 d-flex align-items-center text-center">
				<div class="col">
					<div class="row">
						<h1>Lista de empleados</h1>
					</div>
					<div class="row text-center">
						<table>
							<thead>
								<tr>
									<th>DNI</th>
									<th>Nombre</th>
									<th>Apellido</th>
									<th>Acción</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="empleado : ${empleados}">
									<td th:text="${empleado.dni}"></td>
									<td th:text="${empleado.nombre}"></td>
									<td th:text="${empleado.apellidos}"></td>
									<td>
										<a th:href="@{/delete/{id}(id=${empleado.id})}">Eliminar</a>
									</td>
									<td>
										<a th:href="@{/new/empleado(id=${empleado.id})}">Modificar</a>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
		<a class="mt-2 mb-5" th:href="@{/new/empleado}">Nuevo empleado</a>
		<div class="row">
			<div class="col">
				<div class="row">
					<h1 class="mt-5">Lista de empleados mejorada</h1>
				</div>
					<div  id="tabla2-container" th:insert="~{fragmentos/segundatabla :: tabla2}"></div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
	<script th:src="@{/js/jsEmpleado.js}"></script>
</body>

</html>
