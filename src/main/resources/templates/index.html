<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<title>Empleados</title>
</head>
<style>
	table,
	th,
	td {
		border: 1px solid black;
		border-collapse: collapse;
	}

	th,
	td {
		padding: 8px;
		text-align: left;
	}
</style>

<body>
	<h1>Lista de empleados</h1>
	<table>
		<thead>
			<tr>
				<th>DNI</th>
				<th>Nombre</th>
				<th>Apellido</th>
				<th>Acción</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="empleado : ${empleados}">
				<td th:text="${empleado.dni}"></td>
				<td th:text="${empleado.nombre}"></td>
				<td th:text="${empleado.apellidos}"></td>
				<td>
					<a th:href="@{/delete/{id}(id=${empleado.id})}">Eliminar</a>
				</td>
			</tr>
	</table>
	<a th:href="@{/new/empleado}">Nuevo empleado</a>
</body>

</html>
